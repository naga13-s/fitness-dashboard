<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>💪 My Fitness Tracker</title>
        <link rel="manifest" href="manifest.json">
        <link rel="icon" type="image/png" href="b3535b47-e13d-4042-8ebb-c6cfb6b5772d.png">
        <link rel="stylesheet" href="styles.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>💪 My Fitness Tracker</h1>
                <p>Your journey, your rules.</p>
            </div>
        </header>

        <nav class="navbar">
            <button class="nav-btn active" data-tab="dashboard">Dashboard</button>
            <button class="nav-btn" data-tab="workout">Workouts</button>
            <button class="nav-btn" data-tab="nutrition">Meals</button>
            <button class="nav-btn" data-tab="goals">Goals</button>
            <button class="nav-btn" data-tab="history">History</button>
        </nav>

        <main class="main-content">
            
            <section id="dashboard" class="tab-content active">
                <div class="summary-grid">
                    <div class="summary-card">
                        <h3>🔥 Burned</h3>
                        <p class="summary-value" id="caloriesBurned">0</p>
                        <p class="summary-unit">kcal</p>
                    </div>
                    <div class="summary-card">
                        <h3>🥗 Consumed</h3>
                        <p class="summary-value" id="caloriesConsumed">0</p>
                        <p class="summary-unit">kcal</p>
                    </div>
                    <div class="summary-card">
                        <h3>⚖️ Net</h3>
                        <p class="summary-value" id="netCalories">0</p>
                        <p class="summary-unit">kcal</p>
                    </div>
                    <div class="summary-card">
                        <h3>🏃 Sessions</h3>
                        <p class="summary-value" id="workoutCount">0</p>
                        <p class="summary-unit">count</p>
                    </div>
                </div>

                <div class="dashboard-charts">
                    <div class="chart-box">
                        <h2>Weekly Progress</h2>
                        <div class="chart-container">
                            <canvas id="caloriesChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-box">
                        <h2>Nutrient Intake</h2> <div class="chart-container">
                            <canvas id="macroChart"></canvas>
                        </div>
                    </div>
                </div>
            </section>

            <section id="workout" class="tab-content">
                <h2>Log Your Workout</h2>
                <form id="workoutForm" class="form">
                    <div class="form-group">
                        <label>Date:</label>
                        <input type="date" id="workoutDate" required>
                    </div>
                    <div class="form-group">
                        <label>Exercise Type:</label>
                        <select id="workoutType" required>
                            <option value="">Select an exercise</option>
                            <option value="Running">Running</option>
                            <option value="Cycling">Cycling</option>
                            <option value="Swimming">Swimming</option>
                            <option value="Weight Training">Weight Training</option>
                            <option value="Yoga">Yoga</option>
                            <option value="HIIT">HIIT</option>
                            <option value="Walking">Walking</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Duration (min):</label>
                        <input type="number" id="workoutDuration" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Calories Burned:</label>
                        <input type="number" id="workoutCalories" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Notes:</label>
                        <textarea id="workoutNotes" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Workout</button>
                </form>
                <div id="workoutList" class="list-container"></div>
            </section>

            <section id="nutrition" class="tab-content">
                <h2>Log Your Meal</h2>
                <form id="nutritionForm" class="form">
                    <div class="form-group"><label>Date:</label><input type="date" id="mealDate" required></div>
                    <div class="form-group">
                        <label>Meal Type:</label>
                        <select id="mealType" required>
                            <option value="Breakfast">Breakfast</option>
                            <option value="Lunch">Lunch</option>
                            <option value="Dinner">Dinner</option>
                            <option value="Snack">Snack</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Meal Name:</label><input type="text" id="mealName" required></div>
                    <div class="form-group"><label>Calories:</label><input type="number" id="calories" min="0" required></div>
                    <div class="form-group"><label>Protein (g):</label><input type="number" id="protein" min="0"></div>
                    <div class="form-group"><label>Carbs (g):</label><input type="number" id="carbs" min="0"></div>
                    <div class="form-group"><label>Fat (g):</label><input type="number" id="fat" min="0"></div>
                    <button type="submit" class="btn btn-primary">Save Meal</button>
                </form>
                <div id="mealList" class="list-container"></div>
            </section>

            <section id="goals" class="tab-content">
                <h2>Your Fitness Goals</h2>
                <form id="goalsForm" class="form">
                    <div class="form-group"><label>Daily Calorie Goal:</label><input type="number" id="dailyCalorieGoal"></div>
                    <div class="form-group"><label>Daily Protein Goal (g):</label><input type="number" id="proteinGoal"></div>
                    <div class="form-group"><label>Weekly Workouts Goal:</label><input type="number" id="workoutGoal"></div>
                    <button type="submit" class="btn btn-primary">Update Goals</button>
                </form>
                <div id="goalsDisplay" class="goals-container"></div>
            </section>

            <section id="history" class="tab-content">
                <h2>Activity History</h2>
                <div class="history-controls">
                    <button id="exportBtn" class="btn btn-secondary">Export Data</button>
                    <button id="clearBtn" class="btn btn-danger">Clear All</button>
                </div>
                <div id="historyContainer" class="list-container"></div>
            </section>
        </main>

        <footer class="footer">
            <p> © 2025 Created by Naga 💪 | Move. Track. Evolve.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
